<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="../SETFOP_favicon.png" />
<title>SETFOP / Notes</title>
<style>
:root{
  --bg:#09080f;--panel:#100e1c;--panel2:#141126;--border:#2a1f45;
  --accent:#a78bfa;--accent2:#7c3aed;--text:#ede9fe;--muted:#77718f;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text)}
body{font-family:"DM Sans",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* AUTH */
#auth{
  min-height:100vh;display:grid;place-items:center;padding:24px;
}
.auth-card{
  width:min(460px,100%);padding:42px;background:var(--panel);
  border:1px solid var(--border);border-radius:6px;
  box-shadow:0 25px 90px #0008;
}
.brand{
  font-family:"DM Mono",monospace;color:var(--accent);
  font-size:13px;letter-spacing:.22em;
}
.auth-card h1{
  font-family:"DM Sans",system-ui,sans-serif;font-size:32px;
  margin:22px 0 10px;letter-spacing:-.03em;
}
.auth-card p{color:var(--muted);line-height:1.7;margin:0 0 28px}
.github-btn{
  width:100%;height:50px;border:1px solid var(--accent);
  background:var(--accent);color:#09080f;border-radius:3px;
  font-family:"DM Mono",monospace;font-size:13px;font-weight:600;
  letter-spacing:.08em;transition:.2s;
}
.github-btn:hover{background:#c4b5fd;transform:translateY(-1px)}
.auth-note{
  margin-top:18px!important;margin-bottom:0!important;
  font-family:"DM Mono",monospace;font-size:11px;
}

/* APP */
#app{height:100vh;display:grid;grid-template-columns:280px 1fr}
.sidebar{
  min-width:0;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
}
.sidebar-head{padding:20px;border-bottom:1px solid var(--border)}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.repo-label{font:11px "DM Mono",monospace;color:var(--muted);margin-top:7px}
.new-btn{
  width:34px;height:34px;border:1px solid var(--border);background:var(--panel2);
  color:var(--accent);border-radius:3px;font-size:21px;line-height:1;
}
.new-btn:hover{border-color:var(--accent)}
.file-list{padding:10px;overflow:auto;flex:1}
.file{
  display:flex;align-items:center;gap:10px;padding:10px 11px;margin-bottom:2px;
  border-radius:3px;color:var(--muted);font:13px "DM Mono",monospace;cursor:pointer;
}
.file:hover,.file.active{background:var(--panel2);color:var(--text)}
.file-icon{color:var(--accent);font-size:11px}
.sidebar-foot{padding:14px;border-top:1px solid var(--border)}
.signout{
  width:100%;height:38px;background:transparent;color:var(--muted);
  border:1px solid var(--border);border-radius:3px;font:11px "DM Mono",monospace;
  letter-spacing:.1em;
}
.signout:hover{color:var(--text);border-color:var(--accent)}

.editor-area{min-width:0;display:flex;flex-direction:column}
.toolbar{
  height:62px;display:flex;align-items:center;gap:10px;
  padding:0 18px;border-bottom:1px solid var(--border);
}
.file-name{flex:1;font:13px "DM Mono",monospace;color:var(--text)}
.tool-btn{
  height:34px;padding:0 14px;background:var(--panel2);color:var(--muted);
  border:1px solid var(--border);border-radius:3px;font:11px "DM Mono",monospace;
}
.tool-btn:hover{color:var(--text);border-color:var(--accent)}
.save-btn{background:var(--accent);border-color:var(--accent);color:#09080f;font-weight:600}
.save-btn:hover{background:#c4b5fd}
.editor{
  width:100%;height:calc(100vh - 62px);resize:none;border:0;outline:0;
  background:#07060d;color:var(--text);padding:30px;
  font:14px/1.8 "DM Mono",monospace;
}
.empty{height:100%;display:grid;place-items:center;color:var(--muted)}
.empty-inner{text-align:center;font:12px "DM Mono",monospace}
.empty-inner .plus{font-size:30px;color:var(--accent);margin-bottom:10px}

/* mobile */
@media(max-width:700px){
  #app{grid-template-columns:1fr;grid-template-rows:38vh 62vh}
  .sidebar{border-right:0;border-bottom:1px solid var(--border)}
  .editor{height:calc(62vh - 62px)}
  .auth-card{padding:30px}
}
</style>
</head>

<body>

<!--
  SETFOP NOTES
  -----------------------------
  Frontend only.

  AUTHENTICATION CONTRACT:
    GET /notes-auth/login
      -> starts GitHub OAuth and returns/redirects to /notes/

    GET /notes-auth/session
      -> { "authenticated": true, "login": "github-user" }

    GET /notes-api/files
      -> [ { "name":"linux.md", "path":"notes/linux.md" } ]

    GET /notes-api/file?path=notes/linux.md
      -> { "content":"...", "sha":"..." }

    PUT /notes-api/file
      body: { "path":"notes/linux.md", "content":"...", "sha":"..." }

    DELETE /notes-api/file
      body: { "path":"notes/linux.md", "sha":"..." }

  The GitHub OAuth secret MUST NOT be placed in this HTML file.
-->

<section id="auth">
  <div class="auth-card">
    <div class="brand">SETFOP / NOTES</div>
    <h1>Private Notes</h1>
    <p>
      This area is not listed on the SETFOP website.
      GitHub authorization is required to continue.
    </p>

    <button class="github-btn" onclick="signIn()">
      CONTINUE WITH GITHUB
    </button>

    <p class="auth-note">
      Access is handled by GitHub. No GitHub password is entered here.
    </p>
  </div>
</section>

<section id="app" class="hidden">

  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="head-row">
        <div>
          <div class="brand">SETFOP / NOTES</div>
          <div class="repo-label" id="userLabel">AUTHORIZED</div>
        </div>
        <button class="new-btn" onclick="newFile()" title="New note">+</button>
      </div>
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="sidebar-foot">
      <button class="signout" onclick="signOut()">SIGN OUT</button>
    </div>
  </aside>

  <main class="editor-area">
    <div class="toolbar">
      <div class="file-name" id="fileName">No file selected</div>
      <button class="tool-btn hidden" id="deleteBtn" onclick="deleteFile()">DELETE</button>
      <button class="tool-btn save-btn hidden" id="saveBtn" onclick="saveFile()">SAVE</button>
    </div>

    <div class="empty" id="empty">
      <div class="empty-inner">
        <div class="plus">+</div>
        SELECT A NOTE OR CREATE A NEW ONE
      </div>
    </div>

    <textarea class="editor hidden" id="editor" spellcheck="false"></textarea>
  </main>
</section>

<script>
/*
  This file deliberately contains NO GitHub client secret.

  A tiny server/edge function must perform the OAuth code exchange.
  That is required because GitHub's web OAuth flow returns an authorization
  code and the access-token exchange uses a client secret.

  Replace the endpoint paths below with your backend/edge-function paths.
*/
const ENDPOINTS = {
  login:  "/notes-auth/login",
  session:"/notes-auth/session",
  logout: "/notes-auth/logout",
  files:  "/notes-api/files",
  file:   "/notes-api/file"
};

let current = null;

function $(id){ return document.getElementById(id); }

async function signIn(){
  // Redirect to the authentication endpoint.
  window.location.href = ENDPOINTS.login;
}

async function checkSession(){
  try{
    const res = await fetch(ENDPOINTS.session,{credentials:"include"});
    if(!res.ok) return false;

    const data = await res.json();

    if(data.authenticated){
      $("auth").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("userLabel").textContent =
        data.login ? "@" + data.login : "AUTHORIZED";
      await loadFiles();
      return true;
    }
  }catch(e){
    // Backend is not installed yet; remain on login screen.
  }
  return false;
}

async function loadFiles(){
  $("fileList").innerHTML =
    '<div style="padding:10px;font:11px DM Mono,monospace;color:var(--muted)">LOADING...</div>';

  try{
    const res = await fetch(ENDPOINTS.files,{credentials:"include"});
    if(!res.ok) throw new Error("Could not load notes.");

    const data = await res.json();

    const files = data.filter(f =>
      /\.(md|txt)$/i.test(f.name || f.path || "")
    );

    $("fileList").innerHTML = "";

    if(!files.length){
      $("fileList").innerHTML =
        '<div style="padding:10px;font:11px DM Mono,monospace;color:var(--muted)">NO NOTES YET</div>';
      return;
    }

    for(const f of files){
      const el = document.createElement("div");
      el.className = "file";
      el.innerHTML =
        '<span class="file-icon">▸</span>' +
        escapeHtml(f.name || f.path.split("/").pop());
      el.onclick = () => openFile(f);
      $("fileList").appendChild(el);
    }
  }catch(e){
    $("fileList").innerHTML =
      '<div style="padding:10px;font:11px DM Mono,monospace;color:#f87171">' +
      escapeHtml(e.message) + '</div>';
  }
}

async function openFile(file){
  try{
    const path = file.path || ("notes/" + file.name);
    const res = await fetch(
      ENDPOINTS.file + "?path=" + encodeURIComponent(path),
      {credentials:"include"}
    );

    if(!res.ok) throw new Error("Could not open note.");

    const data = await res.json();

    current = {
      path:path,
      name:file.name || path.split("/").pop(),
      sha:data.sha || null
    };

    $("fileName").textContent = current.name;
    $("editor").value = data.content || "";
    $("editor").classList.remove("hidden");
    $("empty").classList.add("hidden");
    $("saveBtn").classList.remove("hidden");
    $("deleteBtn").classList.remove("hidden");
  }catch(e){
    alert(e.message);
  }
}

function newFile(){
  const name = prompt("New note name (.md or .txt):");
  if(!name) return;

  if(!/^[a-zA-Z0-9._-]+\.(md|txt)$/i.test(name)){
    alert("Filename must end with .md or .txt");
    return;
  }

  current = {
    path:"notes/" + name,
    name:name,
    sha:null
  };

  $("fileName").textContent = name;
  $("editor").value = "";
  $("editor").classList.remove("hidden");
  $("empty").classList.add("hidden");
  $("saveBtn").classList.remove("hidden");
  $("deleteBtn").classList.add("hidden");
  $("editor").focus();
}

async function saveFile(){
  if(!current) return;

  const btn = $("saveBtn");
  btn.disabled = true;
  btn.textContent = "SAVING...";

  try{
    const res = await fetch(ENDPOINTS.file,{
      method:"PUT",
      credentials:"include",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        path:current.path,
        content:$("editor").value,
        sha:current.sha
      })
    });

    if(!res.ok) throw new Error("Could not save note.");

    const data = await res.json();
    current.sha = data.sha || current.sha;

    btn.textContent = "SAVED";
    await loadFiles();
    setTimeout(()=>btn.textContent="SAVE",1000);
  }catch(e){
    alert(e.message);
    btn.textContent = "SAVE";
  }finally{
    btn.disabled = false;
  }
}

async function deleteFile(){
  if(!current || !confirm("Delete " + current.name + "?")) return;

  try{
    const res = await fetch(ENDPOINTS.file,{
      method:"DELETE",
      credentials:"include",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        path:current.path,
        sha:current.sha
      })
    });

    if(!res.ok) throw new Error("Could not delete note.");

    current = null;
    $("fileName").textContent = "No file selected";
    $("editor").classList.add("hidden");
    $("empty").classList.remove("hidden");
    $("saveBtn").classList.add("hidden");
    $("deleteBtn").classList.add("hidden");
    await loadFiles();
  }catch(e){
    alert(e.message);
  }
}

async function signOut(){
  try{
    await fetch(ENDPOINTS.logout,{method:"POST",credentials:"include"});
  }catch(e){}
  location.reload();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

checkSession();
</script>
</body>
</html>
